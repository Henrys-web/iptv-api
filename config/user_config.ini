[Settings]
# 1. 声明想要管理和输出的分类（必须与您的 user_demo.txt 大类名称严格一致）
channel_genres = 央视频道,卫视频道,香港频道,澳门频道,台湾频道

# 2. 指定读取的本地个人自定义模板文件路径（香港、澳门、台湾拆分版）
source_file = config/user_demo.txt

# 3. 核心修改：改为 .m3u 后缀，只有这样程序才会将 UA 写入结果，供播放器使用
final_file = output/user_result.m3u

# 4. GitHub Actions 环境必备加速（采用最新的代理服务，解决拉取境外源超时问题）
cdn_url = http://qninq.cn

# 5. 【全局 UA 设置】对所有无特殊说明的接口统一指定一个通用移动/电视端 UA（避免逐条添加）
user_agent = Mozilla/5.0 (Linux; Android 10; TV) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/100.0.0.0 Safari/537.36

# 6. 港澳台网络优化：将测速超时时间放宽至 10 秒，防止误杀境外优质源
sort_timeout = 10

# 7. 工作流测速速度优化（提升并发线程，大幅压缩 Actions 运行耗时）
thread_limit = 50

# 8. 每个频道最终保留的最快直播源线路数量
urls_limit = 5

# 9. 网络协议筛选（设为 all，兼容 IPv4 和 IPv6）
ip_version = all
